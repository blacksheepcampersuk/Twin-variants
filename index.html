<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
  </head>
  <body>
    <!-- <model-viewer> HTML element -->
    <model-viewer src="Twin Bench.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.webp" shadow-intensity="1" shadow-softness="1" exposure="1" background colour="transparent"> </model-viewer>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>

    <!-- Color Choice Interface -->
  <div class="controls">
    <!-- These match your exact casing: Green, blue, black, cream -->
    <button class="color-btn" data-variant="Green">Green</button>
    <button class="color-btn" data-variant="Blue">Blue</button>
    <button class="color-btn" data-variant="Black">Black</button>
    <button class="color-btn" data-variant="Cream">Cream</button>
  </div>

  <script>
    // 1. Grab our viewer and button elements from the HTML page
    const modelViewer = document.querySelector("#product-viewer");
    const buttons = document.querySelectorAll(".color-btn");

    // 2. Wait until the 3D model finishes downloading completely
    modelViewer.addEventListener("load", () => {
      
      // Look inside your browser console (F12) to see if names match your buttons!
      console.log("Available variants found in GLB:", modelViewer.availableVariants);

      // 3. Loop through every button and listen for a click
      buttons.forEach(button => {
        button.addEventListener("click", () => {
          
          // Get the target color name from the clicked button
          const targetVariant = button.getAttribute("data-variant");
          
          // Swap the variant color layout instantly
          modelViewer.variantName = targetVariant;
          
        }); // Closes addEventListener click
      }); // Closes forEach loop

    }); // Closes addEventListener load
  </script>
  </body>
</html>
